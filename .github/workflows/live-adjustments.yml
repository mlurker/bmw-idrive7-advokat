name: Engine Config tests

on:
  pull_request:
    paths:
      - 'apps/live_adjustments/**'
      - 'kit/runtime/diag.js'
      - 'kit/runtime/readonly-diag.js'
      - 'kit/runtime/sgbd.js'
      - 'kit/runtime/sheet.js'
      - 'kit/tools/test_bm3_protocol.js'
      - 'kit/tools/test_live_adjustments.js'
      - 'kit/tools/test_live_adjustments_exhaust.js'
      - 'kit/tools/test_diag_options.js'
      - 'kit/tools/test_diag_replies.js'
      - '.github/workflows/live-adjustments.yml'
  push:
    paths:
      - 'apps/live_adjustments/**'
      - 'kit/runtime/diag.js'
      - 'kit/runtime/readonly-diag.js'
      - 'kit/runtime/sgbd.js'
      - 'kit/runtime/sheet.js'
      - 'kit/tools/test_bm3_protocol.js'
      - 'kit/tools/test_live_adjustments.js'
      - 'kit/tools/test_live_adjustments_exhaust.js'
      - 'kit/tools/test_diag_options.js'
      - 'kit/tools/test_diag_replies.js'
      - '.github/workflows/live-adjustments.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kit/tools/test_bm3_protocol.js
      - run: node kit/tools/test_live_adjustments.js
      - run: node kit/tools/test_live_adjustments_exhaust.js
      - run: node kit/tools/test_diag_options.js
      - run: node kit/tools/test_diag_replies.js
